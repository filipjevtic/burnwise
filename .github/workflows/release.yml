name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate tag matches package version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$TAG" != "${{ steps.package.outputs.version }}" ]; then
            echo "Tag version ($TAG) does not match package.json version (${{ steps.package.outputs.version }})"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          config-file: .github/release.yml
          # Tags with a prerelease segment (v0.4.0-alpha, -beta, -rc) are marked
          # prerelease so they don't take the "Latest" badge from a stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}