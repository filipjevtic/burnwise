# Rendered from a template at container start (envsubst) so BURNWISE_SERVER_URL
# is configurable per deployment. Only that var is substituted; nginx runtime
# vars ($host, $remote_addr, …) aren't in the environment so they pass through.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the SPA is built with VITE_API_URL="" and calls /api/...
    # on its own host; nginx proxies those to the server so one built image works
    # in dev, Docker Compose, and Kubernetes (#22).
    location /api/ {
        proxy_pass ${BURNWISE_SERVER_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
