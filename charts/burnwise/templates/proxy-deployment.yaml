{{- if .Values.proxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "burnwise.fullname" . }}-proxy
  labels:
    {{- include "burnwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        {{- include "burnwise.labels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "burnwise.podSecurityContext" 1000 | nindent 8 }}
      containers:
        - name: proxy
          image: {{ include "burnwise.image" (list . "proxy") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "burnwise.containerSecurityContext" 1000 | nindent 12 }}
          env:
            - name: SERVER_URL
              value: {{ include "burnwise.serverUrl" . | quote }}
            - name: PORT
              value: {{ .Values.proxy.service.port | quote }}
            - name: INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "burnwise.secretName" . }}
                  key: INGEST_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: {{ .Values.proxy.service.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          {{- with .Values.proxy.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "burnwise.fullname" . }}-proxy
  labels:
    {{- include "burnwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: proxy
  ports:
    - name: http
      port: {{ .Values.proxy.service.port }}
      targetPort: http
{{- end }}
