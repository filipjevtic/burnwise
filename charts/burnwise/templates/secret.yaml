{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "burnwise.fullname" . }}-secrets
  labels:
    {{- include "burnwise.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.ingestApiKey }}
  INGEST_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.encryptionKey }}
  BURNWISE_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.ciWebhookSecret }}
  CI_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubClientId }}
  GITHUB_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubClientSecret }}
  GITHUB_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleClientId }}
  GOOGLE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.gitlabClientId }}
  GITLAB_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.gitlabClientSecret }}
  GITLAB_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcIssuerUrl }}
  OIDC_ISSUER_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientId }}
  OIDC_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
