apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "burnwise.fullname" . }}-config
  labels:
    {{- include "burnwise.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.server.service.port | quote }}
  {{- with .Values.config.appUrl }}
  APP_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.serverPublicUrl }}
  SERVER_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  JWT_EXPIRY: {{ .Values.config.jwtExpiry | quote }}
  LOCAL_ONLY: {{ .Values.config.localOnly | quote }}
  INTEGRATION_ALLOW_PRIVATE_HOSTS: {{ .Values.config.integrationAllowPrivateHosts | quote }}
  {{- with .Values.config.ssoAllowedDomains }}
  SSO_ALLOWED_DOMAINS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.pricingJson }}
  BURNWISE_PRICING_JSON: {{ . | quote }}
  {{- end }}
  RATE_LIMIT_DISABLED: {{ .Values.config.rateLimit.disabled | quote }}
  RATE_LIMIT_MAX: {{ .Values.config.rateLimit.max | quote }}
  RATE_LIMIT_WINDOW: {{ .Values.config.rateLimit.window | quote }}
  RATE_LIMIT_AUTH_MAX: {{ .Values.config.rateLimit.authMax | quote }}
  RATE_LIMIT_INGEST_MAX: {{ .Values.config.rateLimit.ingestMax | quote }}
